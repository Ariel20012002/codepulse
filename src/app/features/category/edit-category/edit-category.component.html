<div class="container">
    <h1 class="mt-3">Editar Categoria</h1>

    <ng-container *ngIf="category;else notFound">
        <form #form="ngForm" (ngSubmit)="onFormSubmit()">
            <div class="mt-2">
                <div class="mt-3">
                    <label class="form-label" for="categoryId">Id de Categoria</label>
                    <input type="text" disabled
                    id="categoryId"
                    class="form-control"
                    name="categoryId"
                    value="{{category.id}}">
                </div>

                <div class="mt-3">
                    <label class="form-label" for="categoryName">Nombre de Categoria</label>
                    <input type="text"
                    id="categoryName"
                    class="form-control"
                    name="categoryName"
                    [(ngModel)]="category.name">
                </div>

                <div class="mt-3">
                    <label class="form-label" for="categoryUrlHandle">Identificador de Categoria</label>
                    <input type="text"
                    id="categoryUrlHandle"
                    class="form-control"
                    name="categoryUrlHandle"
                    [(ngModel)]="category.urlHandle">
                </div>

                <div class="mt-3">
                    <button type="submit" class="btn btn-primary">Guardar</button>
                </div>
            </div>
        </form>
    </ng-container>
    <ng-template #notFound>
        <div class="alert alert-warning" role="alert">
            ¡No se encontro la categoria!
        </div>  
    </ng-template>
</div>
