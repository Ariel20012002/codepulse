<div class="card h-100">
    <div class="card-header">
        <h3 class="card-title">Imagenes</h3>
    </div>
    <div class="card-body">
        <div class="d-flex flex-md-row flex-sm-column flex-wrap">
            <div class="col-8 p-4">

            </div>
            <div class="col-4 p-4 bg-light">
                <h5>Subir Imagen</h5>
                <form #form="ngForm" (ngSubmit)="uploadImage()">
                    <div class="mt-3">
                        <input type="file" class="form-control" (change)="onFileUploadChange($event)">
                    </div>

                    <div class="mt-3">
                        <input type="text" class="form-control" placeholder="Nombre del Archivo"
                        name="filename" [(ngModel)]="fileName">
                    </div>

                    <div class="mt-3">
                        <input type="text" class="form-control" placeholder="Titulo"
                        name="title" [(ngModel)]="title">
                    </div>          
                    
                    <div class="mt-3">
                        <button type="submit" class="btn btn-dark">Subir</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
